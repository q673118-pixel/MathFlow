name: MathFlow Android build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "redesign-ui" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MATHFLOW_KEYSTORE_PASSWORD: ${{ secrets.MATHFLOW_KEYSTORE_PASSWORD }}
      MATHFLOW_KEY_ALIAS: ${{ secrets.MATHFLOW_KEY_ALIAS }}
      MATHFLOW_KEY_PASSWORD: ${{ secrets.MATHFLOW_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare stable APK signing key
        env:
          MATHFLOW_KEYSTORE_BASE64: ${{ secrets.MATHFLOW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MATHFLOW_KEYSTORE_BASE64" ]; then
            printf '%s' "$MATHFLOW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mathflow-signing.jks"
            echo "MATHFLOW_KEYSTORE_PATH=$RUNNER_TEMP/mathflow-signing.jks" >> "$GITHUB_ENV"
            echo "Stable MathFlow signing key configured."
          else
            echo "::warning::Stable signing secrets are not configured. This APK will use the temporary runner debug key and may not update an APK from another workflow run."
          fi

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug


      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MathFlow-v1.5.4-${{ github.ref_name }}-build-${{ github.run_number }}-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MathFlow-v1.5.4-${{ github.ref_name }}-build-${{ github.run_number }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
