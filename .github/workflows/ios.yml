name: MathFlow iOS build

on:
  workflow_dispatch:
  push:
    branches: [ "redesign-ui-ios" ]
    paths:
      - "ios/**"
      - "MathFlowCore/**"
      - "scripts/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: mathflow-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate native iOS app icons from Android vectors
        run: swift scripts/generate_ios_icons.swift

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/MathFlow.xcodeproj -scheme MathFlow

      - name: Run math-core tests
        run: swift test --package-path MathFlowCore

      - name: Build iOS Simulator app
        run: |
          xcodebuild build -project ios/MathFlow.xcodeproj -scheme MathFlow -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO

      - name: Run native iOS simulator tests on multiple screen sizes
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          for DEVICE in "iPhone SE (3rd generation)" "iPhone 16" "iPhone 16 Pro Max"; do
            echo "Testing on ${DEVICE}"
            xcodebuild test \
              -project ios/MathFlow.xcodeproj \
              -scheme MathFlow \
              -destination "platform=iOS Simulator,name=${DEVICE}" \
              -derivedDataPath build/ios \
              -parallel-testing-enabled NO \
              CODE_SIGNING_ALLOWED=NO
          done

      - name: Capture visual layout screenshots on all screen sizes
        run: |
          set -euo pipefail
          APP_PATH="build/ios/Build/Products/Debug-iphonesimulator/MathFlow.app"
          mkdir -p build/screenshots
          for DEVICE in "iPhone SE (3rd generation)" "iPhone 16" "iPhone 16 Pro Max"; do
            echo "Capturing ${DEVICE}"
            xcrun simctl boot "$DEVICE" 2>/dev/null || true
            xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl install "$DEVICE" "$APP_PATH"
            xcrun simctl launch "$DEVICE" com.mathflow.ios -mathflow.welcomeSeen YES
            sleep 4
            SAFE_NAME="$(echo "$DEVICE" | tr ' ()' '___')"
            xcrun simctl io "$DEVICE" screenshot "build/screenshots/${SAFE_NAME}.png"
            xcrun simctl shutdown "$DEVICE" || true
          done

      - name: Upload visual layout screenshots
        uses: actions/upload-artifact@v4
        with:
          name: MathFlow-iOS-Visual-Screenshots-${{ github.run_number }}
          path: build/screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Verify all alternate icons are registered in the app bundle
        run: |
          INFO_PLIST="build/ios/Build/Products/Debug-iphonesimulator/MathFlow.app/Info.plist"
          plutil -extract CFBundleIcons.CFBundleAlternateIcons json -o - "$INFO_PLIST"

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: MathFlow-iOS-Simulator-${{ github.run_number }}
          path: build/ios/Build/Products/Debug-iphonesimulator/MathFlow.app
          if-no-files-found: error
          retention-days: 7
